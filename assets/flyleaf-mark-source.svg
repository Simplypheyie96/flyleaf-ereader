  <rect width="512" height="512" rx="116" fill="url(#sky)"/>
  <!-- THE SAME PATH AS src/brand/Wordmark.tsx, character for character. The only
       difference is the scale on the group: a home-screen icon needs a margin
       inside its tile that the in-app mark does not, and 0.78 about the centre
       is that margin. Scaling rather than re-typing the coordinates is the
       point — there is no second set of numbers to drift out of sync.

       Ink and not white. This tile used to hold a pale sheet on a pale sky and
       vanished at the 48px a home screen shrinks it to; the whole point of a
       solid mark is that it survives there.

       Change this and you must change Wordmark.tsx, leaf-icon-maskable.svg,
       KeepIcon in src/components/TabIcons.tsx (the 24-unit original), and
       re-render the PNGs beside this file. -->
