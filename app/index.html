  <body>
    <!-- Launch screen. Inline and ahead of the bundle on purpose: it is the
         first paint of a cold start, so it must not wait on a stylesheet, a
         web font, or React. main.tsx fades it out once the app has rendered.
         Press's screen, with this app's one line under the name. -->
    <style>
      #splash{
        position:fixed; inset:0; z-index:9999;
        display:flex; align-items:center; justify-content:center;
        background:#F4F2ED; color:#1B1917;
        /* 420ms, not 260: the exit should read as the screen settling out of
           the way, not as a cut. Must stay under the 600ms removal fallback
           in main.tsx, which is what guarantees the overlay never sticks. */
        transition:opacity 420ms cubic-bezier(.22,1,.36,1);
      }
      /* The mark, the NAME, a printer's rule, and one line saying what this
         is — four elements, and the rule is what makes them read as two
         groups rather than a list of four.

         It used to read "Flyleaf" over a line about the device, which named
         the family and the privacy promise and never once said the thing you
         were waiting for was an ereader — a cold start looked like Press
         loading slowly. The name carries that now, in the same form Press
         uses ("Flyleaf Press").

         What ALSO used to be here was a fourth line listing five file
         extensions in a third typeface. It went, and the screen is
         significantly better for it: three stacked text lines under a mark is
         a manifest, not a welcome, and the extension list was the weakest of
         the three — a spec sheet where the reader wanted a name. Everything it
         was defending against ("is this Press loading slowly?") the word
         eReader already settles. It also cost a whole third face, a
         no-wrap constraint that pinned the copy to what fits inside 32px
         padding at 320px, and the awkwardness of setting a list and a
         sentence in one stack. If it comes back, it belongs on Home next to
         the import control, where a reader is actually choosing a file.

         Local font stacks only: the web fonts are still in flight at this
         point and a swap mid-fade is worse than the fallback. */
      #splash-in{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 32px; }
      /* 96, not 88: the lozenge is 280 wide to 416 tall where the rosette it
         replaced was near-square, so at equal box height it reads
         appreciably lighter. 96 puts its ink at 78px tall by 52px wide, which
         carries the same weight on the screen as the rosette's 67px did. */
      #splash svg{ width:96px; height:96px; }
      #splash b{
        display:block; margin-top:24px; font:500 30px/1.1 "Playfair Display",Georgia,serif;
        /* Negative at this size, where 25px wanted a hair positive: display
           type reads loose as it grows. */
        letter-spacing:-.008em;
      }
      /* A printer's rule, hairline and short. It separates the identity from
         the statement about it — the one hierarchy this screen has — and does
         it with 1px instead of the 3rd typeface and 4th line that used to.
         currentColor at .18 so it derives from the ground and needs no token
         of its own on either scheme. */
      #splash i{
        display:block; width:40px; height:1px; margin-top:22px;
        background:currentColor; opacity:.18;
      }
      #splash small{
        display:block; margin-top:20px; max-width:24em;
        font:500 11px/1.6 "Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        letter-spacing:.16em; text-transform:uppercase; opacity:.55;
      }
      #splash.is-out{ opacity:0; pointer-events:none; }
      @media (prefers-color-scheme: dark){
        #splash{ background:#151515; color:#E9E9E9; }
      }
    </style>
    <div id="splash" aria-hidden="true">
      <div id="splash-in">

        <b>Flyleaf eReader</b>
        <i></i>
        <small>Read what you own</small>
      </div>
    </div>
