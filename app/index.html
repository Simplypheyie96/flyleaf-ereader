  <body>
    <!-- Launch screen. Inline and ahead of the bundle on purpose: it is the
         first paint of a cold start, so it must not wait on a stylesheet, a
         web font, or React. main.tsx fades it out once the app has rendered.
         Press's screen, with this app's one line under the name. -->
    <style>
      #splash{
        position:fixed; inset:0; z-index:9999;
        display:flex; align-items:center; justify-content:center;
        background:#F4F2ED; color:#1B1917;
        /* 420ms, not 260: the exit should read as the screen settling out of
           the way, not as a cut. Must stay under the 600ms removal fallback
           in main.tsx, which is what guarantees the overlay never sticks. */
        transition:opacity 420ms cubic-bezier(.22,1,.36,1);
      }
      /* The mark, the NAME, and two lines saying what this is.

         It used to read "Flyleaf" over a line about the device, which named
         the family and the privacy promise and never once said the thing you
         were waiting for was an ereader — a cold start looked like Press
         loading slowly. The name carries it now, in the same form Press uses
         ("Flyleaf Press"), and the format list under it settles the question
         before the app has painted a single page.

         Local font stacks only: the web fonts are still in flight at this
         point and a swap mid-fade is worse than the fallback. */
      #splash-in{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 32px; }
      #splash svg{ width:88px; height:88px; }
      #splash b{
        display:block; margin-top:22px; font:500 25px/1.1 "Playfair Display",Georgia,serif;
        letter-spacing:.005em;
      }
      #splash small{
        display:block; margin-top:12px; max-width:24em;
        font:500 12px/1.6 "Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        letter-spacing:.1em; text-transform:uppercase; opacity:.62;
      }
      /* The formats, in the chrome's mono — a different voice from the line
         above it, because it is a different KIND of statement: that one is a
         sentence, this one is a list of file extensions, and setting them
         identically (as Press sets its two lines) would read as one wrapped
         paragraph. Quieter, wider, and monospaced, which is what makes it
         legible as a list at a glance.

         No max-width: this must not wrap. A format list broken over two lines
         reads as prose that ran out of room, and this one is what tells a
         reader on a cold start that the thing loading opens book files.

         Five formats, not the six it started with, and not the nine the app
         actually reads. Six measured 261px against the 256px available inside
         the 32px padding at 320px — the narrowest phone supported here, and
         the one my first note forgot, having checked 375 and called it the
         floor. Five measures 218px there, with room to spare. It reads as
         "these among others", which is what it is; the exhaustive list lives
         in Settings, where there is width for it. */
      #splash small.fmt{
        margin-top:16px; max-width:none; text-transform:none;
        font:400 11px/1.4 "IBM Plex Mono",ui-monospace,monospace;
        letter-spacing:.06em; opacity:.42;
      }
      #splash.is-out{ opacity:0; pointer-events:none; }
      @media (prefers-color-scheme: dark){
        #splash{ background:#151515; color:#E9E9E9; }
      }
    </style>
